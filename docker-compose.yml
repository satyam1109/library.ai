services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: library-ai-pgvector
    environment:
      POSTGRES_DB: library_ai
      POSTGRES_USER: library_ai
      POSTGRES_PASSWORD: library_ai
    ports:
      # Port 5432 is already commonly occupied by another local PostgreSQL.
      - "5433:5432"
    volumes:
      - library_ai_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_ai -d library_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: library-ai-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - library_ai_esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  library_ai_pgdata:
  library_ai_esdata:
