spring.application.name=library-ai
server.port=8090
spring.config.import=optional:file:./application-secret.properties

# A stable, cost-efficient model is enough for our first text-generation call.
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# Lower temperature favors focused, repeatable answers over creative variation.
spring.ai.google.genai.chat.temperature=0.2

# Allow moderately detailed learning answers while keeping each response bounded.
spring.ai.google.genai.chat.max-output-tokens=800

# Reuse the same secret already configured for Gemini chat. This property is an
# alias, not a second API key.
spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key}

# Documents and questions must use the same model and vector dimensions.
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT
spring.ai.google.genai.embedding.text.dimensions=768

# Local pgvector runs on 5433 because another PostgreSQL container may already
# use the conventional host port 5432.
spring.datasource.url=${LIBRARY_AI_DB_URL:jdbc:postgresql://localhost:5433/library_ai}
spring.datasource.username=${LIBRARY_AI_DB_USERNAME:library_ai}
spring.datasource.password=${LIBRARY_AI_DB_PASSWORD:library_ai}

# Spring AI creates the vector table and HNSW cosine index when they do not exist.
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=library_chunks
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.max-document-batch-size=100

# Application-level retrieval settings are shared by configuration and services.
library.ai.retrieval.embedding-model=gemini-embedding-001
library.ai.retrieval.embedding-dimensions=768
library.ai.retrieval.default-top-k=5
library.ai.retrieval.max-top-k=20
library.ai.retrieval.schema-name=public
library.ai.retrieval.table-name=library_chunks

# Keep this learning endpoint small enough to process synchronously and safely.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
