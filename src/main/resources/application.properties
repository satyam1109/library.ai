spring.application.name=library-ai
server.port=8090
spring.config.import=optional:file:./application-secret.properties

# A stable, cost-efficient model is enough for our first text-generation call.
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# Lower temperature favors focused, repeatable answers over creative variation.
spring.ai.google.genai.chat.temperature=0.2

# Bound generated output so one request cannot produce an unnecessarily long answer.
spring.ai.google.genai.chat.max-output-tokens=300
